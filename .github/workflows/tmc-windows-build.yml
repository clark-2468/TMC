name: TMC Windows development build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmc-windows-build.yml'
      - 'scripts/package-tmc-portable.ps1'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export complete source tree
        run: |
          archive="$RUNNER_TEMP/TechMeCoding-source-${GITHUB_SHA:0:12}.zip"
          git archive --format=zip --prefix=TechMeCoding/ -o "$archive" HEAD
          unzip -tq "$archive"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/TechMeCoding-source-*.zip
          archive: false
          if-no-files-found: error

  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Locate x64 Windows SDK tools
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem -LiteralPath $sdkBin -Directory |
            Where-Object { $_.Name -match '^10[.]' } |
            Sort-Object { [version] $_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/signtool.exe' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $signTool) { throw 'The x64 Windows SDK SignTool is missing.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path $signTool -Parent)

      - name: Package the Windows x64 desktop application
        run: pnpm run gulp vscode-win32-x64

      - name: Create and test the portable ZIP
        shell: pwsh
        run: ./scripts/package-tmc-portable.ps1

      - name: Upload portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/TechMeCoding-portable-win32-x64-*.zip
          archive: false
          if-no-files-found: error
